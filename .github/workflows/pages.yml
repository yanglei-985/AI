name: Deploy site to GitHub Pages

on:
  push:
    # the repo currently has only the development branch; main is listed for when it exists
    branches: [main, claude/exciting-clarke-22etrz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and build data
        run: node scripts/build.mjs
      - name: Stamp version (cache busting)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
